<section>

    @if(selectedGame()) {
    <article
        class="border rounded-lg border-slate-200 bg-slate-100 p-3 flex flex-col content-center hover:cursor-pointer hover:bg-slate-200">
        <h2 class="font-bold my-2 text-center mb-4">{{ selectedGame()?.title }}</h2>
        <img class="px-6" src="{{ selectedGame()?.image }}" alt="{{ selectedGame()?.title }}">
        <p class="mt-4">{{ selectedGame()?.description }}</p>
        <div class="flex justify-between mt-4">
            <p class="font-medium">{{ selectedGame()?.category }}</p>
            <p class="font-semibold">{{ selectedGame()?.price }}€</p>
        </div>
    </article>

    } @else {
        <p>The game was not found</p>
    }



</section>
<button routerLink="/products"
    class="px-2 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-800 mt-6 font-semibold">Volver al listado</button>
